name: PR Check

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    runs-on: ubuntu-latest

    # Throwaway database so the boot check (which runs TypeORM synchronize)
    # never touches production data or schema.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chronicle
          POSTGRES_PASSWORD: chronicle
          POSTGRES_DB: chronicle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronicle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 👇 ADD THIS NEW STEP 👇
      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      # 👆 NEW STEP END 👆

      - name: Check merge conflict with main
        run: |
          echo "Fetching latest main..."
          git fetch origin main

          echo "Creating temp merge branch..."
          # Note: Since you're checking out a detached HEAD in actions/checkout, 
          # you should base the merge attempt on the target branch (main).
          git checkout -b temp origin/main

          echo "Attempting merge with PR branch..."
          if ! git merge --no-commit --no-ff origin/${{ github.event.pull_request.head.ref }}; then
            echo "❌ Merge conflict detected! Please resolve conflicts locally."
            exit 1
          fi

          echo "✅ No merge conflicts"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Validate build script
        run: npm run build

      - name: Validate dev server (app runs)
        env:
          # CI-only values: no production secrets are used here.
          DATABASE_URL: postgres://chronicle:chronicle@localhost:5432/chronicle_ci
          DB_SSL: "false"
          JWT_SECRET: ci-only-secret
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: ci-only-key
          SUPABASE_BUCKET: ci
          PORT: 3000
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:3000
        run: |
          echo "Starting dev server..."
          npm run start &
          SERVER_PID=$!

          echo "Waiting for server to boot (20 seconds max)..."
          for i in {1..10}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "✅ Server started successfully after $((i*2)) seconds"
              kill $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            echo "Attempt $i failed, retrying in 2 seconds..."
            sleep 2
          done

          echo "❌ Server failed to boot within 20 seconds."
          kill $SERVER_PID 2>/dev/null || true
          exit 1
